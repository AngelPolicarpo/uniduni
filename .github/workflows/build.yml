# Empacota o produto nos dois alvos do v1 (§1: Windows x64 e Linux x64).
# O .exe/.AppImage sai como ARTIFATO desta execução — não há publicação
# automática (`--publish never`).
#
# Os addons nativos (better-sqlite3, sodium-native, fs-native-extensions) já
# chegam prontos em `prebuilds/` e são resolvidos por node-gyp-build. Instalar
# com `--ignore-scripts` evita a regra implícita do npm que dispara
# `node-gyp rebuild` em todo pacote com `binding.gyp`: no Windows isso falha
# (o runner traz VS 18, que o node-gyp 11.x não identifica) e nos dois alvos é
# trabalho jogado fora, porque o binário do tarball é o que vai ser usado.
name: build

on:
  workflow_dispatch:

defaults:
  run:
    shell: bash

jobs:
  pacote:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            alvo: "--win"
          - os: ubuntu-24.04
            alvo: "--linux"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Build do frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Build do core
        working-directory: core
        run: |
          npm ci --ignore-scripts
          npm run build

      - name: Dependências do app
        working-directory: app
        run: npm ci --ignore-scripts

      - name: Build do app
        working-directory: app
        run: npm run build

      - name: Montar renderer e core dentro do pacote
        working-directory: app
        run: npm run montar

      - name: Empacotar (${{ matrix.alvo }})
        working-directory: app
        run: npx electron-builder --config electron-builder.json ${{ matrix.alvo }} --publish never

      - name: Artifacts
        uses: actions/upload-artifact@v6
        with:
          name: pacote-${{ matrix.os }}
          path: |
            app/release/*.exe
            app/release/*.AppImage
          if-no-files-found: error
